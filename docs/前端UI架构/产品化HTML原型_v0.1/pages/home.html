<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>笛语</title>
    <link
      rel="icon"
      href="../../../../assets/brand/diyu-vi/svg/favicon.svg"
    />
    <link rel="stylesheet" href="../shared/prototype.css" />
    <script src="../shared/prototype.js" defer></script>
  </head>
  <body>
    <main class="home-page">
      <section class="home-stage" aria-labelledby="home-title">
        <div
          class="brand-sequence is-running"
          data-brand-animation
          data-duration-ms="7200"
          data-complete="false"
          aria-label="笛语品牌标识动效，点击可跳过"
        >
          <svg
            class="brand-sequence__animated"
            viewBox="-167.31 -223.11 717.62 390.42"
            aria-hidden="true"
          >
            <path
              class="brand-arc"
              d="M 72.115 -124.907 A 144.230 144.230 0 1 1 -72.115 -124.907"
              fill="none"
              stroke="#171614"
              stroke-width="11.540"
              stroke-linecap="round"
              pathLength="1"
            />
            <path
              class="brand-triangle"
              d="M 0 -205.800 L 23.100 -144.200 L -23.100 -144.200 Z"
              fill="#B7462E"
            />
            <circle
              class="brand-dot brand-dot--one"
              cx="0"
              cy="-49.000"
              r="11.800"
              fill="#171614"
            />
            <circle
              class="brand-dot brand-dot--two"
              cx="0"
              cy="0"
              r="11.800"
              fill="#171614"
            />
            <circle
              class="brand-dot brand-dot--three"
              cx="0"
              cy="49.000"
              r="11.800"
              fill="#171614"
            />
          </svg>
          <img
            class="brand-sequence__final"
            src="../../../../assets/brand/diyu-vi/svg/diyu-logo-horizontal.svg"
            alt="笛语 DIYU AGENT"
          />
        </div>
        <div class="home-reveal">
          <h1 id="home-title">让品牌内容，始终像自己。</h1>
          <p>从一句想法，到可直接使用的内容与陈列方案。</p>
          <a class="button button--primary" href="login-user.html">进入笛语</a>
        </div>
      </section>
      <div class="home-review-controls" aria-label="原型评审控件">
        <button class="button" type="button" data-animation-skip>跳过动效</button>
        <button class="button" type="button" data-animation-replay>
          重新播放
        </button>
      </div>
    </main>
    <span class="prototype-mark">静态原型 · 首页文案待确认</span>
  </body>
</html>
