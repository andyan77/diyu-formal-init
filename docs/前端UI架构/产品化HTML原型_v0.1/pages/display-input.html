<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>开始陈列搭配 · 笛语</title>
    <link rel="icon" href="../../../../assets/brand/diyu-vi/svg/favicon.svg" />
    <link rel="stylesheet" href="../shared/prototype.css" />
    <script src="../shared/prototype.js" defer></script>
  </head>
  <body>
    <header class="product-header">
      <a class="product-header__brand" href="user-home.html">
        <img class="brand-image brand-image--compact" src="../../../../assets/brand/diyu-vi/svg/diyu-logo-horizontal.svg" alt="笛语" />
      </a>
      <nav class="app-tabs" aria-label="工作切换">
        <a href="content-empty.html">内容生产</a>
        <a href="display-input.html" aria-current="page">陈列搭配</a>
      </nav>
      <div class="product-header__context"><strong>折线之间 · 南城店</strong></div>
      <details class="product-header__account">
        <summary><span>林澄</span>⌄</summary>
        <div class="identity-popover">
          <dl>
            <div><dt>当前门店</dt><dd>折线之间 · 南城店</dd></div>
            <div><dt>本次墙面</dt><dd>入口右侧挂墙</dd></div>
            <div><dt>可用条件</dt><dd>单杆、8 个挂位、现有商品</dd></div>
          </dl>
        </div>
      </details>
    </header>
    <section class="workbench" data-mobile-view="conversation">
      <aside class="workbench__nav">
        <div class="side-nav">
          <p class="side-nav__label">陈列搭配</p>
          <nav aria-label="陈列工作导航">
            <a href="display-input.html" aria-current="page">开始一个方案</a>
            <a href="display-result.html">最近方案</a>
          </nav>
        </div>
      </aside>
      <main class="workbench__conversation">
        <header class="conversation-heading">
          <p class="eyebrow">开始一个方案</p>
          <h1>告诉我，这面墙现在有什么。</h1>
          <p>用门店里的自然说法描述商品和目标，不必整理成表格。</p>
        </header>
        <form class="composer" data-demo-form="已模拟生成一份陈列搭配方案。">
          <div class="composer__head">
            <strong>这次要解决</strong>
            <select aria-label="墙面位置">
              <option>入口右侧挂墙</option>
              <option>试衣间外侧挂墙</option>
            </select>
          </div>
          <textarea aria-label="陈列输入" placeholder="例如：一根 8 个挂位的杆，现有深灰短外套 2 件、米白针织 3 件、砖红衬衫 3 件。希望先看见外套，再让颜色慢慢变轻。"></textarea>
          <details class="details">
            <summary>补充现场条件（可选）</summary>
            <div class="details__body">
              <label class="field">不能改变的条件<input type="text" placeholder="例如：不移动灯具，只使用现有挂位" /></label>
            </div>
          </details>
          <div class="composer__foot">
            <span>只用来安排这次墙面，不会改变商品记录。</span>
            <button class="button button--primary" type="submit">生成方案</button>
          </div>
        </form>
        <div class="suggestion-list">
          <h2>也可以从一句话开始</h2>
          <button type="button" data-demo-action="已把示例带入输入框。"><strong>先突出一件主商品</strong><span>其他商品作为颜色回应</span></button>
          <button type="button" data-demo-action="已把示例带入输入框。"><strong>把同色商品排得更有层次</strong><span>不增加新的道具或区域</span></button>
        </div>
      </main>
      <article class="workbench__artifact">
        <div class="artifact-empty">
          <img src="../../../../assets/brand/diyu-vi/svg/diyu-symbol.svg" alt="" />
          <h2>方案会完整出现在这里</h2>
          <p>包括摆放顺序、执行步骤、需要留意的位置和可以局部修改的入口。</p>
        </div>
      </article>
      <nav class="mobile-work-tabs" aria-label="移动工作面">
        <button type="button" data-mobile-tab="conversation" aria-selected="true">对话</button>
        <button type="button" data-mobile-tab="artifact" aria-selected="false">方案</button>
      </nav>
    </section>
    <div class="toast" data-toast role="status" aria-live="polite"></div>
    <span class="prototype-mark">静态产品原型</span>
  </body>
</html>
