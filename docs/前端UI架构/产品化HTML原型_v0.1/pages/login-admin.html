<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>租户管理员登录 · 笛语</title>
    <link
      rel="icon"
      href="../../../../assets/brand/diyu-vi/svg/favicon.svg"
    />
    <link rel="stylesheet" href="../shared/prototype.css" />
    <script src="../shared/prototype.js" defer></script>
  </head>
  <body>
    <main class="auth-page">
      <section class="auth-brand" aria-hidden="true">
        <img
          src="../../../../assets/brand/diyu-vi/svg/diyu-logo-horizontal-ondark.svg"
          alt=""
        />
        <div class="auth-brand__copy">
          <p class="eyebrow">品牌管理</p>
          <h1>让品牌资料、账号与成员始终清楚。</h1>
          <p>这里仅供已经取得品牌管理资格的成员使用。</p>
        </div>
      </section>
      <section class="auth-panel">
        <div class="auth-card">
          <img
            class="auth-card__logo"
            src="../../../../assets/brand/diyu-vi/svg/diyu-logo-horizontal.svg"
            alt="笛语"
          />
          <a class="text-link" href="home.html">← 返回首页</a>
          <h1>租户管理员登录</h1>
          <p>进入当前品牌的管理空间。</p>
          <form
            class="auth-form"
            data-demo-form="登录动作仅作原型演示。"
          >
            <label class="field"
              >用户名
              <input
                name="username"
                autocomplete="username"
                placeholder="请输入用户名"
                required
              />
            </label>
            <label class="field"
              >密码
              <input
                type="password"
                name="password"
                autocomplete="current-password"
                placeholder="请输入密码"
                required
              />
            </label>
            <button class="button button--primary" type="submit">登录</button>
          </form>
          <p class="auth-help">
            当前账号没有管理资格时，请退出后使用租户管理员账号登录。
          </p>
        </div>
      </section>
    </main>
    <div class="toast" data-toast role="status"></div>
    <span class="prototype-mark">静态原型</span>
  </body>
</html>
