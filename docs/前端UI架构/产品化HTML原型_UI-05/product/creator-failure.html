<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>继续这次交流 · 笛语</title>
    <link rel="stylesheet" href="../shared/product.css" />
  </head>
  <body class="creator-page failure-page" data-mobile-view="conversation" data-product-space="creator" data-conversation-stage="failed">
    <header class="creator-topbar">
      <img class="brand-symbol" src="../../../../assets/brand/diyu-vi/svg/diyu-symbol.svg" alt="笛语" />
      <label class="identity-control">发布账号
        <select data-identity-select disabled><option value="hq">总部品牌内容运营</option><option value="store">柯桥门店人物</option></select>
      </label>
      <div class="creator-identity"><span>账号画像</span><strong data-profile-summary>从门店日常与本人观察出发</strong></div>
      <div class="target-controls"><label>平台<select data-platform-select disabled></select></label><label>内容形式<select data-format-select disabled></select></label></div>
    </header>

    <main class="failure-layout">
      <aside class="creator-sidebar">
        <nav aria-label="创作次级导航"><span>当前交流</span><a class="active" href="creator-failure.html?account=store&amp;platform=xiaohongshu&amp;format=graphic">沉默也值得被尊重<small>可以继续</small></a></nav>
      </aside>
      <section class="failure-conversation">
        <div class="message-list" data-message-list>
          <article class="message user" data-message-role="user"><span>你</span><p>今天有点不知道从哪儿开始。</p></article>
          <article class="message assistant" data-message-role="assistant"><span>笛语</span><p>没关系，可以先说最近发生的一件小事，或者一个一直没想明白的感觉。</p></article>
          <article class="message user" data-message-role="user"><span>你</span><p>最近店里总有人只想自己看看。</p></article>
          <article class="message assistant" data-message-role="assistant"><span>笛语</span><p>这个观察可以做成门店人物内容。你更想讲“沉默也应该被尊重”，还是讨论“店员什么时候适合主动介绍”？</p></article>
          <article class="message user" data-message-role="user"><span>你</span><p>讲前一个，别像品牌宣言，要像店员自己的感受。</p></article>
          <article class="failure-message" data-generation-failure>
            <h1>这次还没能整理成一份可靠的成品</h1>
            <p>你的想法仍然保留，可以直接再试一次，也可以告诉我最想保留哪部分。</p>
          </article>
        </div>
        <div class="composer-wrap">
          <div class="composer">
            <label class="sr-only" for="failure-input">继续补充</label>
            <textarea id="failure-input" data-failure-input data-original-input>我最想保留“沉默也应该被尊重”，还要像店员自己的感受。</textarea>
            <div class="composer-actions">
              <button type="button" data-recovery-action="continue">继续补充</button>
              <a class="button-link primary" href="creator-generating.html?account=store&amp;platform=xiaohongshu&amp;format=graphic" data-recovery-action="retry">再试一次</a>
            </div>
          </div>
        </div>
      </section>
    </main>
    <div class="pill" data-page-notice hidden></div>
    <script src="../shared/product.js"></script>
  </body>
</html>
