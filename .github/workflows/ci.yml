name: deterministic-quality-gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          # The determinism gates diff against commits up to 22 back
          # (af20ae5, fa75ea2, 3043217, 357d17c); the default shallow
          # clone cannot see them.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Install PostgreSQL tools
        run: sudo apt-get update && sudo apt-get install --yes postgresql
      - name: Install project dependencies
        run: uv sync --all-groups --no-install-project --locked
      - name: Install frontend dependencies
        run: npm --prefix frontend ci --no-audit --no-fund
      - name: Frontend lint, build and interaction check
        run: make frontend-lint frontend-typecheck frontend-build frontend-test
      - name: Lint
        run: make lint
      - name: Typecheck
        run: make typecheck
      - name: Golden regression
        run: make golden
      - name: EXE-01 determinism gates
        run: make exe01-gates
